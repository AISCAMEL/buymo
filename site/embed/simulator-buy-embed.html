<div id="buymo-sim" data-cta="/buymo-contact.html">
  <style>
    #buymo-sim{max-width:760px;margin:0 auto;font-family:'Noto Sans JP','Yu Gothic',sans-serif;color:#333;}
    #buymo-sim .bs-card{background:#fff;border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,.12);padding:28px;}
    #buymo-sim h3{text-align:center;font-size:22px;font-weight:900;margin:0 0 6px;}
    #buymo-sim .bs-lead{text-align:center;color:#666;font-size:14px;margin:0 0 20px;}
    #buymo-sim .bs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
    #buymo-sim label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;}
    #buymo-sim select{height:48px;border:1px solid #ddd;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;}
    #buymo-sim select:focus{outline:none;border-color:#14B8A6;box-shadow:0 0 0 3px rgba(20,184,166,.15);}
    #buymo-sim .bs-btn{width:100%;height:54px;margin-top:16px;border:none;border-radius:30px;cursor:pointer;font-weight:900;font-size:18px;color:#fff;background:linear-gradient(135deg,#FF8552,#F2591F);}
    #buymo-sim .bs-res{margin-top:22px;text-align:center;background:#1E3A8A;color:#fff;border-radius:16px;padding:24px;}
    #buymo-sim .bs-range{font-size:32px;font-weight:900;color:#FFD700;margin:6px 0 10px;}
    #buymo-sim .bs-note{font-size:12px;color:#b9c2dd;margin-bottom:14px;}
    #buymo-sim .bs-cta{display:inline-block;background:#14B8A6;color:#fff;font-weight:900;border-radius:30px;padding:13px 26px;text-decoration:none;}
    @media(max-width:767px){#buymo-sim .bs-grid{grid-template-columns:1fr;}#buymo-sim .bs-range{font-size:24px;}}
  </style>
  <div class="bs-card">
    <h3>&#x304b;&#x3093;&#x305f;&#x3093;&#x67fb;&#x5b9a;&#x30b7;&#x30df;&#x30e5;&#x30ec;&#x30fc;&#x30b7;&#x30e7;&#x30f3;</h3>
    <p class="bs-lead">&#x8eca;&#x7a2e;&#x30af;&#x30e9;&#x30b9;&#x30fb;&#x5e74;&#x5f0f;&#x30fb;&#x8d70;&#x884c;&#x8ddd;&#x96e2;&#x30fb;&#x72b6;&#x614b;&#x3092;&#x9078;&#x3076;&#x3060;&#x3051;&#x3002;&#x304a;&#x304a;&#x3088;&#x305d;&#x306e;&#x8cb7;&#x53d6;&#x984d;&#x304c;&#x3059;&#x3050;&#x5206;&#x304b;&#x308a;&#x307e;&#x3059;&#x3002;</p>
    <div class="bs-grid">
      <label>&#x8eca;&#x7a2e;&#x30af;&#x30e9;&#x30b9;<select id="bsCls"></select></label>
      <label>&#x5e74;&#x5f0f;<select id="bsYear"></select></label>
      <label>&#x8d70;&#x884c;&#x8ddd;&#x96e2;<select id="bsMile"></select></label>
      <label>&#x72b6;&#x614b;<select id="bsCond"></select></label>
    </div>
    <button type="button" class="bs-btn" id="bsCalc">&#x6982;&#x7b97;&#x3092;&#x307f;&#x308b;</button>
    <div class="bs-res" id="bsRes" hidden>
      <p style="font-weight:700;font-size:14px;color:#cdd6ee;margin:0;">&#x6982;&#x7b97;&#x306e;&#x8cb7;&#x53d6;&#x76ee;&#x5b89;</p>
      <p class="bs-range"><span id="bsMin"></span> &#x301c; <span id="bsMax"></span></p>
      <p class="bs-note">&#x203b; AI&#x306b;&#x3088;&#x308b;&#x6982;&#x7b97;&#x306e;&#x76ee;&#x5b89;&#x3067;&#x3059;&#x3002;&#x5b9f;&#x969b;&#x306e;&#x91d1;&#x984d;&#x306f;&#x8eca;&#x4e21;&#x72b6;&#x614b;&#x306b;&#x3088;&#x308a;&#x7570;&#x306a;&#x308a;&#x307e;&#x3059;&#x3002;&#x6b63;&#x78ba;&#x306a;&#x91d1;&#x984d;&#x306f;&#x7121;&#x6599;&#x67fb;&#x5b9a;&#x3067;&#x3002;</p>
      <a class="bs-cta" id="bsCta" href="#">&#x3053;&#x306e;&#x5185;&#x5bb9;&#x3067;&#x7121;&#x6599;&#x67fb;&#x5b9a;&#x3092;&#x4f9d;&#x983c; &#x203a;</a>
    </div>
  </div>
  <script>
  (function(){
    var root=document.getElementById('buymo-sim');
    var CLASS_BASE={'\u8efd\u81ea\u52d5\u8eca':900000,'\u30b3\u30f3\u30d1\u30af\u30c8':1000000,'\u30bb\u30c0\u30f3':1300000,'\u30df\u30cb\u30d0\u30f3':1600000,'SUV':1800000,'\u8f38\u5165\u8eca\u30fb\u9ad8\u7d1a\u8eca':3000000,'\u30c8\u30e9\u30c3\u30af\u30fb\u5546\u7528\u8eca':1500000};
    var MILEAGE=[['\u301c1\u4e07km',5000],['1\u301c3\u4e07km',20000],['3\u301c5\u4e07km',40000],['5\u301c8\u4e07km',65000],['8\u301c10\u4e07km',90000],['10\u301c15\u4e07km',125000],['15\u4e07km\u301c',170000]];
    var COND={'\u826f\u597d\uff08\u76ee\u7acb\u3064\u50b7\u306a\u3057\uff09':1.0,'\u666e\u901a\uff08\u5c0f\u50b7\u30fb\u7d4c\u5e74\u76f8\u5fdc\uff09':0.85,'\u4fee\u5fa9\u6b74\u30fb\u4e8b\u6545\u8eca':0.55,'\u4e0d\u52d5\u8eca\u30fb\u5ec3\u8eca\u4e88\u5b9a':0.22};
    var now=new Date().getFullYear();
    function opt(v,l){return '<option value="'+v+'">'+(l||v)+'</option>';}
    var cls='';for(var c in CLASS_BASE)cls+=opt(c);root.querySelector('#bsCls').innerHTML=cls;
    var ys='';for(var y=now;y>=now-30;y--)ys+=opt(y,y+'\u5e74');root.querySelector('#bsYear').innerHTML=ys;
    root.querySelector('#bsMile').innerHTML=MILEAGE.map(function(m,i){return opt(i,m[0]);}).join('');
    var cd='';for(var k in COND)cd+=opt(k);root.querySelector('#bsCond').innerHTML=cd;
    function round(n){return n>=100000?Math.round(n/10000)*10000:Math.max(5000,Math.round(n/1000)*1000);}
    function yen(n){return '\u00a5'+(n||0).toLocaleString('en-US');}
    root.querySelector('#bsCalc').addEventListener('click',function(){
      var base=CLASS_BASE[root.querySelector('#bsCls').value]||1000000;
      var age=Math.max(0,now-Number(root.querySelector('#bsYear').value));
      var km=MILEAGE[Number(root.querySelector('#bsMile').value)][1];
      var cf=COND[root.querySelector('#bsCond').value]||1;
      var point=base*Math.max(0.06,Math.pow(0.88,age))*Math.max(0.2,1-(km/10000)*0.05)*cf;
      var mn=Math.max(5000,round(point*0.88)),mx=Math.max(10000,round(point*1.12));
      root.querySelector('#bsMin').textContent=yen(mn);root.querySelector('#bsMax').textContent=yen(mx);
      var cta=root.getAttribute('data-cta')||'#';
      root.querySelector('#bsCta').href=cta+(cta.indexOf('?')<0?'?':'&')+'genre='+encodeURIComponent(root.querySelector('#bsCls').value)+'&est='+encodeURIComponent(yen(mn)+'\u301c'+yen(mx));
      root.querySelector('#bsRes').hidden=false;
    });
  })();
  </script>
</div>
