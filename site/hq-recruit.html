<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>加盟店募集 教育ファネル｜BUYMO 本部</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" /><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" /></noscript>
<link rel="stylesheet" href="assets/css/buymo.css?v=39" />
<link rel="stylesheet" href="assets/css/board.css?v=15" />
</head>
<body>
<script src="assets/js/auth.js?v=2"></script><script>AUTH.guard("hq");</script>
<header class="portal-header">
  <div class="container">
    <a href="portal-login.html" class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/img/buymo/logo-mark.png?v=2" alt="" style="height:26px;width:26px;object-fit:contain;vertical-align:-7px;" /></span> BUYMO</a>
    <span class="portal-title">本部</span>
    <nav class="portal-nav" id="hqNav"></nav>
    <a href="portal-login.html" class="portal-logout">ログアウト</a>
  </div>
</header>

<main class="portal-main">
  <div class="container">
    <div class="report-head">
      <h1>加盟店募集 教育ファネル</h1>
      <span id="rcMsg" class="rc-msg"></span>
    </div>
    <p class="portal-sub">加盟店募集のお問い合わせ（加盟店申込）をリスト化し、ステップ配信で教育 → セミナー予約 → 加盟 → 加盟後ケアまでを一元管理します。ステージ・メモ・配信状況は自動保存され、本部内で共有されます。</p>

    <section class="rc-line" id="rcLine"></section>

    <div class="rc-kpis" id="rcKpis"></div>

    <details class="rc-config">
      <summary>⚙️ ステップ配信テンプレート／セミナー日程の設定</summary>
      <div class="rc-config-body">
        <div class="rc-cfg-col">
          <h3>📧 ステップ配信テンプレート</h3>
          <p class="rc-hint">送付する順に登録します。各リードで「送付済み」に印を付け、文面はコピーしてメール/LINEで送れます。</p>
          <div id="rcSteps"></div>
          <button id="rcAddStep" class="rc-btn-o" type="button">＋ ステップを追加</button>
        </div>
        <div class="rc-cfg-col">
          <h3>🎤 セミナー日程</h3>
          <p class="rc-hint">日程を登録すると、各リードの「セミナー予約」で選べます。予約人数も集計します。</p>
          <div id="rcSeminars"></div>
          <button id="rcAddSeminar" class="rc-btn-o" type="button">＋ 日程を追加</button>
        </div>
      </div>
    </details>

    <div class="rc-bar">
      <div class="rc-filters" id="rcFilters"></div>
      <button id="rcAddLead" class="rc-btn-o" type="button">＋ リードを手動追加</button>
    </div>

    <div id="rcLeads"><p class="rc-empty">読み込み中…</p></div>
  </div>
</main>

<style>
.rc-msg{font-size:13px;color:#0A6B3C;font-weight:700;}
.rc-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:6px 0 18px;}
@media(max-width:900px){.rc-kpis{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.rc-kpis{grid-template-columns:repeat(2,1fr);}}
.rc-kpi{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;}
.rc-kpi .k-num{font-size:22px;font-weight:900;color:var(--navy);line-height:1.1;}
.rc-kpi .k-label{font-size:11px;color:#888;margin-top:4px;font-weight:700;}
.rc-kpi.join .k-num{color:#0A6B3C;}

.rc-config{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;padding:4px 18px;}
.rc-config summary{cursor:pointer;font-weight:900;color:var(--navy);padding:12px 0;font-size:15px;}
.rc-config-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:8px 0 18px;}
@media(max-width:860px){.rc-config-body{grid-template-columns:1fr;}}
.rc-cfg-col h3{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:6px;}
.rc-hint{font-size:11.5px;color:#999;margin-bottom:12px;line-height:1.6;}
.rc-step,.rc-seminar{background:#f8fafc;border:1px solid #eef1f6;border-radius:10px;padding:12px;margin-bottom:10px;}
.rc-step input,.rc-step textarea,.rc-seminar input{width:100%;border:1px solid #dde3ee;border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;margin-bottom:8px;}
.rc-step textarea{resize:vertical;line-height:1.6;}
.rc-step .rc-step-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.rc-step .rc-step-head input{margin-bottom:0;}
.rc-step .rc-days{max-width:90px;}
.rc-del{background:none;border:0;color:#c00;cursor:pointer;font-size:12px;opacity:.6;}
.rc-del:hover{opacity:1;}
.rc-btn-o{background:#fff;border:1px dashed #0A6B3C;color:#0A6B3C;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}

.rc-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.rc-filters{display:flex;gap:8px;flex-wrap:wrap;}
.rc-chip{border:1px solid #dde3ee;background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;color:#556;cursor:pointer;}
.rc-chip.on{background:#0A6B3C;color:#fff;border-color:#0A6B3C;}

.rc-lead{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.rc-lead-head{display:grid;grid-template-columns:1.4fr 1.3fr .9fr 1fr auto;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;}
@media(max-width:820px){.rc-lead-head{grid-template-columns:1fr 1fr;}}
.rc-lead-name{font-weight:900;color:var(--navy);font-size:14px;}
.rc-lead-name small{display:block;font-weight:400;color:#888;font-size:11.5px;margin-top:2px;}
.rc-lead-meta{font-size:12px;color:#666;}
.rc-stage-sel{height:36px;border:1px solid #ddd;border-radius:8px;padding:0 8px;font-size:13px;font-family:inherit;font-weight:700;}
.rc-prog{font-size:12px;color:#0A6B3C;font-weight:700;}
.rc-prog .rc-bar-mini{display:block;height:6px;background:#eef1f6;border-radius:6px;margin-top:4px;overflow:hidden;}
.rc-prog .rc-bar-mini span{display:block;height:100%;background:linear-gradient(90deg,#0A6B3C,#22a35c);}
.rc-toggle{font-size:12px;color:#0A6B3C;font-weight:700;white-space:nowrap;}
.rc-lead-body{border-top:1px solid #eef1f6;padding:16px 18px;background:#fbfdfc;display:none;}
.rc-lead.open .rc-lead-body{display:block;}
.rc-lead-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:820px){.rc-lead-grid{grid-template-columns:1fr;}}
.rc-sub-h{font-size:12px;font-weight:900;color:#8a94a6;margin-bottom:10px;letter-spacing:.02em;}
.rc-step-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f6;font-size:13px;}
.rc-step-row input[type=checkbox]{width:17px;height:17px;accent-color:#0A6B3C;flex:0 0 auto;}
.rc-step-row .rc-step-name{flex:1;font-weight:700;color:var(--navy);}
.rc-step-row .rc-step-sub{font-size:11px;color:#999;}
.rc-copy{background:#0A6B3C;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.rc-field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#556;margin-bottom:12px;}
.rc-field input,.rc-field select,.rc-field textarea{border:1px solid #dde3ee;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
.rc-field textarea{resize:vertical;line-height:1.6;}
.rc-care-item{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--navy);padding:6px 0;}
.rc-care-item input{width:17px;height:17px;accent-color:#0A6B3C;}
.rc-care-link{display:inline-block;margin-top:8px;font-size:12px;color:#0A6B3C;font-weight:700;}
.rc-empty{color:#999;padding:24px;text-align:center;}

/* 公式LINE・動画説明会（hq-recruit-line.js） */
.rc-demo{background:#fff7e6;border:1px solid #ffd591;color:#ad6800;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;margin-bottom:12px;}
.lf{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px;}
.lf-step{flex:1;min-width:92px;text-align:center;}
.lf-step b{display:block;font-size:24px;font-weight:900;color:var(--navy);line-height:1.1;}
.lf-step span{font-size:11px;color:#888;font-weight:700;}
.lf-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b0b8c6;font-weight:900;font-size:14px;}
.lf-arrow small{font-size:10.5px;color:#0A6B3C;}
.la-head h2{font-size:15px;font-weight:900;color:var(--navy);margin:0 0 10px;}
.la-head h2 span{font-size:12px;color:#c0392b;margin-left:6px;}
.la-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:20px;}
.la-card{position:relative;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px 12px 16px;cursor:pointer;border-left:5px solid #ccc;}
.la-card b{display:block;font-size:14px;color:var(--navy);margin-top:6px;}
.la-card small{display:block;font-size:12px;color:#667;line-height:1.5;margin-top:2px;}
.la-badge{display:inline-block;font-size:11px;font-weight:900;border-radius:20px;padding:2px 9px;background:#eef1f6;color:#556;}
.la-when{position:absolute;right:12px;top:12px;font-size:11px;color:#999;}
.la-card.lv-red{border-left-color:#d93a2b}.la-card.lv-red .la-badge{background:#fdecea;color:#c0392b}
.la-card.lv-orange{border-left-color:#f08c2a}.la-card.lv-orange .la-badge{background:#fff1e3;color:#b85c00}
.la-card.lv-green{border-left-color:#0A6B3C}.la-card.lv-green .la-badge{background:#e6f4ec;color:#0A6B3C}
.la-card.lv-gray{border-left-color:#b0b8c6}
.lb-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.lb{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 8px;background:#eef1f6;color:#556;}
.lb-line{background:#e8f9ee;color:#06893a;}
.lb-pause{background:#fdecea;color:#c0392b;}
.lb-sem{background:#e8f1fb;color:#0261a5;}
.lb-consult{background:#FFF1E0;color:#A4520B;}
.lc{margin-top:14px;padding:12px;border:1px solid #F3D9B8;background:#FFFAF2;border-radius:10px;}
.lc-when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 8px;font-size:14px;color:#1a2b49;}
.lc-when a{font-size:12px;font-weight:700;color:#0261a5;}
.lc-nourl{font-size:12px;font-weight:700;color:#B4321F;}
.lc-info{margin:0 0 10px;font-size:12px;line-height:1.7;color:#4a5568;background:#fff;border-radius:8px;padding:8px 10px;}
.lc-res{margin:0 0 8px;font-size:12px;font-weight:700;color:#A4520B;}
.lc-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.lc-btn{border:1px solid #E3C9A6;background:#fff;color:#1a2b49;border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.lc-btn.on{background:#1a2b49;border-color:#1a2b49;color:#fff;}
.lc-btn:disabled{opacity:.6;cursor:default;}
.lob{border-color:#C9E4D6;background:#F5FBF8;}
.lnm{margin-top:14px;padding:12px;border:1px solid #D9DEF0;background:#F7F8FD;border-radius:10px;}
.lnm .lc-res small{font-weight:400;color:#6b7a90;margin-left:4px;}
.lnm-row{display:flex;gap:6px;margin:6px 0;}
.lnm-row input{flex:1;min-width:0;}
.lnm-todo{margin:6px 0 0;font-size:12px;color:#8a4b00;font-weight:700;}
.lnm-todo .la-btn{margin-left:6px;padding:4px 10px;}
.lb-name{background:#FFF1DB;color:#8a4b00;}
.lob .lc-when small{font-size:11px;color:#6b7a90;font-weight:700;}
.lob .rc-field{margin-bottom:8px;}
.lob select,.lob input{width:100%;}
.lob-docs{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:6px;font-size:12.5px;}
.lob-docs li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff;border-radius:8px;padding:7px 9px;}
.lob-docs b{flex:1 1 100%;font-size:12.5px;color:#1a2b49;}
.lob-st{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#eef1f5;color:#6b7a90;}
.lob-ok{background:#E3F6EC;color:#0A6B3C;}.lob-ng{background:#FDECEA;color:#B4321F;}.lob-sent{background:#FFF1E0;color:#A4520B;}
.lob-mini{border:1px solid #cfd6e0;background:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.ltr{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.ltr p{margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;font-size:13px;}
.ltr .ltr-ppl{font-size:12px;color:#4a5568;display:block;}
.ltr textarea{width:100%;min-height:60px;border:1px solid #cfd6e0;border-radius:8px;padding:8px;font-family:inherit;font-size:12.5px;margin:4px 0 6px;box-sizing:border-box;}
.lt-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px dashed #e3e8f0;}
@media(max-width:820px){.lt-grid{grid-template-columns:1fr;}}
.ltl{list-style:none;margin:0;padding:0;max-height:360px;overflow:auto;}
.ltl li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f6;}
.ltl-ico{flex:0 0 22px;text-align:center;}
.ltl small{display:block;font-size:11px;color:#99a;font-weight:700;}
.ltl p{margin:2px 0 0;font-size:13px;color:#334;line-height:1.6;}
.ltl-bubble{display:inline-block;background:#f4f6fa;border-radius:10px;padding:6px 10px;}
.ltl-user .ltl-bubble{background:#e8f9ee;}
/* システムの状態（hq-recruit-line.js） */
.lh{margin:0 0 14px;border-radius:12px;background:#fff;box-shadow:var(--shadow);border-left:6px solid #9AA4B2;overflow:hidden;}
.lh.lh-ok{border-left-color:#1E9E5A;}.lh.lh-warn{border-left-color:#E89B1A;}.lh.lh-ng{border-left-color:#D93A2B;}
.lh-wait{margin:0;padding:12px 16px;font-size:13px;color:#667;}
.lh-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;background:none;border:0;text-align:left;cursor:pointer;font-family:inherit;}
.lh-dot{width:12px;height:12px;border-radius:50%;flex:none;background:#9AA4B2;}
.lh-ok .lh-dot{background:#1E9E5A;}.lh-warn .lh-dot{background:#E89B1A;}.lh-ng .lh-dot{background:#D93A2B;animation:lhblink 1.2s infinite;}
@keyframes lhblink{50%{opacity:.35}}
.lh-title{flex:1;min-width:0;display:flex;flex-direction:column;}
.lh-title b{font-size:15px;color:var(--navy);}
.lh-title small{font-size:11.5px;color:#889;}
.lh-more{font-size:12px;font-weight:700;color:#0A6B3C;flex:none;}
.lh-body{padding:0 16px 14px;}
.lh-items{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;}
.lh-items li{display:grid;grid-template-columns:22px 110px 1fr;gap:6px;font-size:13px;line-height:1.6;padding:6px 8px;border-radius:8px;background:#F6F8FA;}
.lh-items li.lv-warn{background:#FFF6E5;}.lh-items li.lv-ng{background:#FDECEA;}
.lh-items b{color:var(--navy);}
.lh-stats{font-size:12.5px;color:#556;margin:0 0 10px;line-height:1.7;}
.lh-stats b{display:block;color:var(--navy);font-size:13px;}
.lh-sub{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 4px;}
.lh-errors{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;}
.lh-errors li{display:grid;grid-template-columns:78px 150px 1fr;gap:6px;font-size:12.5px;padding:5px 8px;border-radius:8px;background:#FDECEA;}
.lh-errors time{color:#889;font-variant-numeric:tabular-nums;}
.lh-errors b{color:#9B2C20;}
.lh-none{font-size:12.5px;color:#1E7A48;margin:0 0 10px;}
.lh-reload{background:none;border:1px solid #CBD5E1;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--navy);}
@media(max-width:600px){.lh-items li{grid-template-columns:22px 1fr;}.lh-items li span:last-child{grid-column:2;}.lh-errors li{grid-template-columns:1fr;}}
.la-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.la-btn{display:block;text-align:center;background:#06C755;color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit;}
.la-btn-o{background:#fff;color:#0A6B3C;border:1px solid #0A6B3C;}
.la-btn:disabled{opacity:.6;cursor:default;}
.la-ai-state{font-size:12px;font-weight:700;color:#0A6B3C;background:#EAF8EF;border-radius:8px;padding:8px 10px;margin:0;line-height:1.6;}
.la-ai-state.off{color:#B4321F;background:#FDECEA;}
.lk-box{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px;border-left:5px solid #06C755;}
.lk-box b{display:block;color:var(--navy);font-size:14px;}
.lk-box p{font-size:12.5px;color:#667;margin:6px 0 0;line-height:1.7;}
.lk-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.lk-row input{flex:1;min-width:200px;border:1px solid #dde3ee;border-radius:8px;padding:9px 10px;font-size:14px;font-family:inherit;}
.lk-row button{background:#06C755;color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;}
.lk-err{color:#c0392b !important;font-weight:700;}
.lk-demo a{color:#0A6B3C;font-weight:700;}
.lk-change{text-align:right;margin:-10px 0 16px;}
.lk-change button{background:none;border:0;color:#99a;font-size:11.5px;text-decoration:underline;cursor:pointer;}
</style>

<script src="assets/js/hq-common.js?v=19"></script>
<script src="assets/js/hq-recruit-line.js?v=12" defer></script>
<script src="assets/js/hq-recruit.js?v=5" defer></script>
<script src="assets/js/analytics.js?v=2" defer></script>
</body>
</html>
