<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>加盟店募集 教育ファネル｜BUYMO 本部</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" />
<link rel="stylesheet" href="assets/css/buymo.css?v=37" />
<link rel="stylesheet" href="assets/css/board.css?v=12" />
</head>
<body>
<script src="assets/js/auth.js"></script><script>AUTH.guard("hq");</script>
<header class="portal-header">
  <div class="container">
    <a href="portal-login.html" class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/img/buymo/logo-mark.png?v=2" alt="" style="height:26px;width:26px;object-fit:contain;vertical-align:-7px;" /></span> BUYMO</a>
    <span class="portal-title">本部</span>
    <nav class="portal-nav" id="hqNav"></nav>
    <a href="portal-login.html" class="portal-logout">ログアウト</a>
  </div>
</header>

<main class="portal-main">
  <div class="container">
    <div class="report-head">
      <h1>加盟店募集 教育ファネル</h1>
      <span id="rcMsg" class="rc-msg"></span>
    </div>
    <p class="portal-sub">加盟店募集のお問い合わせ（加盟店申込）をリスト化し、ステップ配信で教育 → セミナー予約 → 加盟 → 加盟後ケアまでを一元管理します。ステージ・メモ・配信状況は自動保存され、本部内で共有されます。</p>

    <div class="rc-kpis" id="rcKpis"></div>

    <details class="rc-config">
      <summary>⚙️ ステップ配信テンプレート／セミナー日程の設定</summary>
      <div class="rc-config-body">
        <div class="rc-cfg-col">
          <h3>📧 ステップ配信テンプレート</h3>
          <p class="rc-hint">送付する順に登録します。各リードで「送付済み」に印を付け、文面はコピーしてメール/LINEで送れます。</p>
          <div id="rcSteps"></div>
          <button id="rcAddStep" class="rc-btn-o" type="button">＋ ステップを追加</button>
        </div>
        <div class="rc-cfg-col">
          <h3>🎤 セミナー日程</h3>
          <p class="rc-hint">日程を登録すると、各リードの「セミナー予約」で選べます。予約人数も集計します。</p>
          <div id="rcSeminars"></div>
          <button id="rcAddSeminar" class="rc-btn-o" type="button">＋ 日程を追加</button>
        </div>
      </div>
    </details>

    <div class="rc-bar">
      <div class="rc-filters" id="rcFilters"></div>
      <button id="rcAddLead" class="rc-btn-o" type="button">＋ リードを手動追加</button>
    </div>

    <div id="rcLeads"><p class="rc-empty">読み込み中…</p></div>
  </div>
</main>

<style>
.rc-msg{font-size:13px;color:#0A6B3C;font-weight:700;}
.rc-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:6px 0 18px;}
@media(max-width:900px){.rc-kpis{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.rc-kpis{grid-template-columns:repeat(2,1fr);}}
.rc-kpi{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;}
.rc-kpi .k-num{font-size:22px;font-weight:900;color:var(--navy);line-height:1.1;}
.rc-kpi .k-label{font-size:11px;color:#888;margin-top:4px;font-weight:700;}
.rc-kpi.join .k-num{color:#0A6B3C;}

.rc-config{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;padding:4px 18px;}
.rc-config summary{cursor:pointer;font-weight:900;color:var(--navy);padding:12px 0;font-size:15px;}
.rc-config-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:8px 0 18px;}
@media(max-width:860px){.rc-config-body{grid-template-columns:1fr;}}
.rc-cfg-col h3{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:6px;}
.rc-hint{font-size:11.5px;color:#999;margin-bottom:12px;line-height:1.6;}
.rc-step,.rc-seminar{background:#f8fafc;border:1px solid #eef1f6;border-radius:10px;padding:12px;margin-bottom:10px;}
.rc-step input,.rc-step textarea,.rc-seminar input{width:100%;border:1px solid #dde3ee;border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;margin-bottom:8px;}
.rc-step textarea{resize:vertical;line-height:1.6;}
.rc-step .rc-step-head{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.rc-step .rc-step-head input{margin-bottom:0;}
.rc-step .rc-days{max-width:90px;}
.rc-del{background:none;border:0;color:#c00;cursor:pointer;font-size:12px;opacity:.6;}
.rc-del:hover{opacity:1;}
.rc-btn-o{background:#fff;border:1px dashed #0A6B3C;color:#0A6B3C;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}

.rc-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.rc-filters{display:flex;gap:8px;flex-wrap:wrap;}
.rc-chip{border:1px solid #dde3ee;background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;color:#556;cursor:pointer;}
.rc-chip.on{background:#0A6B3C;color:#fff;border-color:#0A6B3C;}

.rc-lead{background:#fff;border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;}
.rc-lead-head{display:grid;grid-template-columns:1.4fr 1.3fr .9fr 1fr auto;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;}
@media(max-width:820px){.rc-lead-head{grid-template-columns:1fr 1fr;}}
.rc-lead-name{font-weight:900;color:var(--navy);font-size:14px;}
.rc-lead-name small{display:block;font-weight:400;color:#888;font-size:11.5px;margin-top:2px;}
.rc-lead-meta{font-size:12px;color:#666;}
.rc-stage-sel{height:36px;border:1px solid #ddd;border-radius:8px;padding:0 8px;font-size:13px;font-family:inherit;font-weight:700;}
.rc-prog{font-size:12px;color:#0A6B3C;font-weight:700;}
.rc-prog .rc-bar-mini{display:block;height:6px;background:#eef1f6;border-radius:6px;margin-top:4px;overflow:hidden;}
.rc-prog .rc-bar-mini span{display:block;height:100%;background:linear-gradient(90deg,#0A6B3C,#22a35c);}
.rc-toggle{font-size:12px;color:#0A6B3C;font-weight:700;white-space:nowrap;}
.rc-lead-body{border-top:1px solid #eef1f6;padding:16px 18px;background:#fbfdfc;display:none;}
.rc-lead.open .rc-lead-body{display:block;}
.rc-lead-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:820px){.rc-lead-grid{grid-template-columns:1fr;}}
.rc-sub-h{font-size:12px;font-weight:900;color:#8a94a6;margin-bottom:10px;letter-spacing:.02em;}
.rc-step-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f6;font-size:13px;}
.rc-step-row input[type=checkbox]{width:17px;height:17px;accent-color:#0A6B3C;flex:0 0 auto;}
.rc-step-row .rc-step-name{flex:1;font-weight:700;color:var(--navy);}
.rc-step-row .rc-step-sub{font-size:11px;color:#999;}
.rc-copy{background:#0A6B3C;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.rc-field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#556;margin-bottom:12px;}
.rc-field input,.rc-field select,.rc-field textarea{border:1px solid #dde3ee;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
.rc-field textarea{resize:vertical;line-height:1.6;}
.rc-care-item{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--navy);padding:6px 0;}
.rc-care-item input{width:17px;height:17px;accent-color:#0A6B3C;}
.rc-care-link{display:inline-block;margin-top:8px;font-size:12px;color:#0A6B3C;font-weight:700;}
.rc-empty{color:#999;padding:24px;text-align:center;}
</style>

<script src="assets/js/hq-common.js?v=12"></script>
<script src="assets/js/hq-recruit.js?v=1" defer></script>
<script src="assets/js/analytics.js?v=2" defer></script>
</body>
</html>
