<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>請求書｜BUYMO 本部</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" />
<link rel="stylesheet" href="assets/css/buymo.css?v=37" />
<link rel="stylesheet" href="assets/css/board.css?v=10" />
</head>
<body>
<script src="assets/js/auth.js"></script><script>AUTH.guard("hq");</script>
<header class="portal-header">
  <div class="container">
    <a href="portal-login.html" class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/img/buymo/logo-mark.png?v=2" alt="" style="height:26px;width:26px;object-fit:contain;vertical-align:-7px;" /></span> BUYMO</a>
    <span class="portal-title">本部</span>
    <nav class="portal-nav" id="hqNav"></nav>
    <a href="portal-login.html" class="portal-logout">ログアウト</a>
  </div>
</header>

<main class="portal-main">
  <div class="container">
    <div class="report-head">
      <h1>加盟店 請求書（月次）</h1>
      <button id="btnCsv" class="btn btn-primary btn-csv" type="button">⬇ CSV出力</button>
      <img class="page-mascot" src="assets/img/buymo/24_名刺交換ポーズ.png" alt="" aria-hidden="true">
    </div>
    <p class="portal-sub">締め日＝対象月の末日／支払期限＝翌月末。項目は自動計算後もその場で調整できます（保存されます）。</p>

    <div class="bill-bar">
      <label>対象月 <input type="month" id="billMonth" /></label>
      <label class="bill-tax"><input type="checkbox" id="billTax" checked /> 消費税10%を加算（入力は税抜）</label>
      <label class="bill-bank">振込先 <input type="text" id="billBank" placeholder="例：○○銀行 いわき支店 普通 1234567 ゴウドウガイシャアイズ" /></label>
      <span id="billMsg" class="bill-msg"></span>
    </div>

    <div class="hq-table-wrap">
      <table class="bill-table" id="billTable">
        <thead>
          <tr>
            <th>加盟店</th>
            <th>月額<span class="th-sub">積立/ロイヤリティ</span></th>
            <th>紹介料<span class="th-sub">¥1,000×件数</span></th>
            <th>ｵｰｸｼｮﾝ<br>ｼｽﾃﾑ利用料</th>
            <th>ｵｰｸｼｮﾝ<br>成約料<span class="th-sub">5%</span></th>
            <th>出品<br>手数料</th>
            <th>加盟金<span class="th-sub">初回のみ</span></th>
            <th>未納金<span class="th-sub">繰越</span></th>
            <th>ペナルティ</th>
            <th>その他</th>
            <th>小計</th>
            <th>合計<span class="th-sub">税込</span></th>
            <th>発行</th>
          </tr>
        </thead>
        <tbody id="billBody"><tr><td colspan="13" class="bill-empty">読み込み中…</td></tr></tbody>
      </table>
    </div>
    <p class="bill-note" id="billDates"></p>
  </div>
</main>

<style>
.bill-bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px;}
.bill-bar label{font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;}
.bill-bar input[type=month],.bill-bar input[type=text]{height:38px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:14px;font-family:inherit;font-weight:400;}
.bill-bank{flex:1;min-width:280px;}
.bill-bank input{flex:1;}
.bill-tax{font-weight:400 !important;}
.bill-msg{font-size:13px;color:#0F766E;font-weight:700;}
.bill-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
.bill-table th,.bill-table td{padding:8px 10px;border-bottom:1px solid #eef1f6;text-align:right;}
.bill-table th:first-child,.bill-table td:first-child{text-align:left;}
.bill-table thead th{background:#f4f6fa;color:#555;font-weight:700;text-align:right;vertical-align:bottom;}
.bill-table thead th:first-child{text-align:left;}
.th-sub{display:block;font-size:10px;color:#999;font-weight:400;}
.bill-in{width:78px;text-align:right;border:1px solid #dde3ee;border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit;}
.bill-in:focus{outline:2px solid var(--green);border-color:var(--green);}
.bill-total{font-weight:900;color:var(--navy);}
.bill-issue{border:1px solid #0F766E;background:#0F766E;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.bill-empty{color:#999;text-align:center;}
.bill-note{font-size:12px;color:#777;margin-top:12px;}
.hq-table-wrap{overflow-x:auto;}
.bill-table{min-width:1160px;}
</style>

<script src="assets/js/hq-common.js?v=9"></script>
<script src="assets/js/hq-billing.js?v=4" defer></script>
<script src="assets/js/analytics.js?v=2" defer></script>
</body>
</html>
