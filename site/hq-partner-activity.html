<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>加盟店の動き｜BUYMO 本部</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" />
<link rel="stylesheet" href="assets/css/buymo.css?v=38" />
<link rel="stylesheet" href="assets/css/board.css?v=14" />
</head>
<body>
<script src="assets/js/auth.js"></script><script>AUTH.guard("hq");</script>
<header class="portal-header">
  <div class="container">
    <a href="portal-login.html" class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/img/buymo/logo-mark.png?v=2" alt="" style="height:26px;width:26px;object-fit:contain;vertical-align:-7px;" /></span> BUYMO</a>
    <span class="portal-title">本部</span>
    <nav class="portal-nav" id="hqNav"></nav>
    <a href="portal-login.html" class="portal-logout">ログアウト</a>
  </div>
</header>

<main class="portal-main">
  <div class="container" id="actRoot">
    <div class="report-head">
      <h1 id="actTitle">加盟店の動き</h1>
      <span class="pa-controls">
        <label>期間 <select id="actRange">
          <option value="6">直近6ヶ月</option>
          <option value="12">直近12ヶ月</option>
          <option value="3">直近3ヶ月</option>
        </select></label>
        <button id="btnActCsv" class="btn btn-primary btn-csv" type="button">⬇ CSV出力</button>
      </span>
    </div>
    <p class="portal-sub" id="actSub">毎月「買っている加盟店」「買っていない加盟店」を可視化し、動きの止まった加盟店へのフォローを徹底します。台数は成約（契約・入金待ち・完了）案件でカウントします。</p>
    <div id="actBody"><p class="pa-loading">読み込み中…</p></div>
  </div>
</main>

<style>
.pa-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.pa-controls label{font-size:13px;font-weight:700;color:var(--navy);}
.pa-controls select{height:38px;border:1px solid #ddd;border-radius:8px;padding:0 10px;font-size:14px;font-family:inherit;margin-left:6px;}
.pa-loading{color:#999;padding:30px 0;}

/* KPI帯 */
.pa-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 20px;}
@media(max-width:820px){.pa-kpis{grid-template-columns:repeat(2,1fr);}}
.pa-kpi{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;}
.pa-kpi .k-num{font-size:26px;font-weight:900;color:var(--navy);line-height:1.1;}
.pa-kpi .k-num.warn{color:#C2410C;}
.pa-kpi .k-num.good{color:#0F766E;}
.pa-kpi .k-label{font-size:12px;color:#888;margin-top:4px;font-weight:700;}

/* 要フォロー */
.pa-follow{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:22px;border-left:5px solid #C2410C;}
.pa-follow h2{font-size:16px;font-weight:900;color:#9A3412;margin-bottom:4px;}
.pa-follow .pf-sub{font-size:12.5px;color:#777;margin-bottom:14px;}
.pa-flist{display:flex;flex-direction:column;gap:10px;}
.pf-row{display:grid;grid-template-columns:1.1fr .8fr .8fr 2fr auto;gap:12px;align-items:center;background:#FFF7ED;border:1px solid #FEDBAA;border-radius:10px;padding:11px 14px;}
.pf-row.done{background:#F0FDF4;border-color:#BBF7D0;opacity:.75;}
@media(max-width:820px){.pf-row{grid-template-columns:1fr 1fr;}}
.pf-name{font-weight:900;color:var(--navy);font-size:14px;}
.pf-name a{color:var(--navy);text-decoration:none;}
.pf-name a:hover{text-decoration:underline;}
.pf-meta{font-size:12px;color:#666;}
.pf-meta b{color:#C2410C;font-size:15px;}
.pf-memo{border:1px solid #dde3ee;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;width:100%;}
.pf-check{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#555;white-space:nowrap;cursor:pointer;}
.pa-none{color:#0F766E;font-weight:700;padding:6px 0;}

/* マトリクス */
.pa-matrix-wrap{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;overflow-x:auto;}
.pa-matrix-wrap h2{font-size:16px;font-weight:900;color:var(--navy);margin-bottom:14px;}
.pa-matrix{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;}
.pa-matrix th,.pa-matrix td{padding:8px 6px;text-align:center;border-bottom:1px solid #f0f2f6;}
.pa-matrix th:first-child,.pa-matrix td:first-child{text-align:left;white-space:nowrap;padding-left:4px;}
.pa-matrix thead th{background:#f4f6fa;color:#666;font-weight:700;font-size:11.5px;}
.pa-matrix td.pm-store{font-weight:800;color:var(--navy);}
.pa-matrix td.pm-store a{color:var(--navy);text-decoration:none;}
.pa-matrix td.pm-store a:hover{text-decoration:underline;}
.pm-cell{border-radius:6px;font-weight:800;color:#0F766E;}
.pm-cell small{display:block;font-size:9.5px;font-weight:400;color:#5a7d78;}
.pm-h0{background:#FEF2F2;color:#B91C1C;}
.pm-h1{background:#E6F4F1;}
.pm-h2{background:#BFE3DB;}
.pm-h3{background:#8ED0C3;color:#0b5147;}
.pm-tot{font-weight:900;color:var(--navy);background:#f8fafc;}
.pm-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:#888;}
.pm-legend span{display:inline-flex;align-items:center;gap:5px;}
.pm-sw{width:14px;height:14px;border-radius:4px;display:inline-block;}

/* 単店モード */
.pa-bars{display:flex;align-items:flex-end;gap:8px;height:180px;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:20px 18px 14px;margin-bottom:20px;overflow-x:auto;}
.pa-bar{flex:1 1 0;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.pa-bar .b-fill{width:70%;max-width:34px;background:linear-gradient(#0F766E,#14b8a6);border-radius:5px 5px 0 0;min-height:2px;transition:height .3s;}
.pa-bar .b-fill.zero{background:#f0d3d3;}
.pa-bar .b-num{font-size:12px;font-weight:900;color:var(--navy);}
.pa-bar .b-mon{font-size:10px;color:#999;}
.pa-recent{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;}
.pa-recent h2{font-size:15px;font-weight:900;color:var(--navy);margin-bottom:12px;}
.pa-recent table{width:100%;border-collapse:collapse;font-size:13px;}
.pa-recent th,.pa-recent td{padding:7px 8px;border-bottom:1px solid #f0f2f6;text-align:left;}
.pa-recent thead th{background:#f4f6fa;color:#666;font-weight:700;}
.pa-back{font-size:13px;color:var(--green);font-weight:700;text-decoration:none;}
</style>

<script src="assets/js/hq-common.js?v=14"></script>
<script src="assets/js/hq-partner-activity.js?v=2" defer></script>
<script src="assets/js/analytics.js?v=2" defer></script>
</body>
</html>
