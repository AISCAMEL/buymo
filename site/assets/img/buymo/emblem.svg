<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="BUYMO エンブレム">
  <defs>
    <linearGradient id="bmGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C5A04E"/>
      <stop offset="1" stop-color="#F0D78C"/>
    </linearGradient>
    <radialGradient id="bmMint" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#6BF3D8"/>
      <stop offset="0.55" stop-color="#2DE1BC"/>
      <stop offset="1" stop-color="#17B79A"/>
    </radialGradient>
    <filter id="bmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0A1B3D" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Deep-midnight disc (works on white & black) -->
  <circle cx="130" cy="122" r="108" fill="#0A1B3D"/>
  <!-- Champagne-gold accent ring -->
  <circle cx="130" cy="122" r="108" fill="none" stroke="url(#bmGold)" stroke-width="5"/>
  <circle cx="130" cy="122" r="99" fill="none" stroke="url(#bmGold)" stroke-width="1.6" opacity="0.7"/>

  <!-- Gold exchange arrows (buy / turnover loop) around the core -->
  <g fill="none" stroke="#D4AF65" stroke-width="11" stroke-linecap="round">
    <path d="M130 55 A67 67 0 0 1 190 158"/>
    <path d="M130 189 A67 67 0 0 1 70 86"/>
  </g>
  <!-- arrow heads -->
  <path d="M190 158 l16 -3 -3 -18 -20 12 z" fill="#D4AF65"/>
  <path d="M70 86 l-16 3 3 18 20 -12 z" fill="#D4AF65"/>

  <!-- Mint core -->
  <circle cx="130" cy="122" r="46" fill="url(#bmMint)"/>
  <circle cx="130" cy="122" r="46" fill="none" stroke="#0A1B3D" stroke-width="3" opacity="0.35"/>
  <!-- core spark -->
  <circle cx="115" cy="107" r="9" fill="#FFFFFF" opacity="0.45"/>

  <!-- BUYMO pill -->
  <g filter="url(#bmShadow)">
    <rect x="62" y="212" width="136" height="40" rx="20" fill="#0A1B3D"/>
    <rect x="62" y="212" width="136" height="40" rx="20" fill="none" stroke="url(#bmGold)" stroke-width="2"/>
  </g>
  <text x="130" y="240" text-anchor="middle" font-family="'Arial Black','Noto Sans JP',sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="#FFFFFF">BUYMO</text>
</svg>
