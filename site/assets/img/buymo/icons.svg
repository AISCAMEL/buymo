<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- BUYMO 統一アイコンセット / two-tone flat (teal #0F766E + gold #F4B740) viewBox 0 0 48 48 -->

<!-- メール査定 / 無料査定：封筒＋チェック -->
<symbol id="ic-mail" viewBox="0 0 48 48">
  <rect x="5" y="11" width="30" height="22" rx="3.5" fill="#0F766E"/>
  <path d="M7 14l13 9 13-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="34" r="8.5" fill="#F4B740"/>
  <path d="M32.2 34l2.6 2.6 5-5.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 契約 / 引取り：スマートキー -->
<symbol id="ic-key" viewBox="0 0 48 48">
  <rect x="12" y="6" width="18" height="24" rx="6" fill="#0F766E"/>
  <circle cx="21" cy="15" r="5.5" fill="#fff"/>
  <path d="M21 13v4M19 15h4" stroke="#0F766E" stroke-width="2" stroke-linecap="round"/>
  <rect x="18.5" y="29" width="5" height="14" rx="2.2" fill="#F4B740"/>
  <path d="M23.5 34h4M23.5 38h3" stroke="#F4B740" stroke-width="3" stroke-linecap="round"/>
</symbol>

<!-- 写真査定：カメラ＋車 -->
<symbol id="ic-photo" viewBox="0 0 48 48">
  <rect x="4" y="14" width="40" height="26" rx="4" fill="#0F766E"/>
  <path d="M16 14l3-4h10l3 4" fill="#0F766E"/>
  <circle cx="24" cy="27" r="9" fill="#fff"/>
  <circle cx="24" cy="27" r="5" fill="#F4B740"/>
  <rect x="34" y="18" width="6" height="3.4" rx="1.5" fill="#F4B740"/>
</symbol>

<!-- 整備 / アカデミー：ノート＋レンチ -->
<symbol id="ic-manual" viewBox="0 0 48 48">
  <rect x="9" y="6" width="26" height="36" rx="3.5" fill="#0F766E"/>
  <path d="M15 15h14M15 21h14M15 27h9" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M40.5 26.5a5 5 0 0 1-6.7 5.9l-6.3 6.3a2.2 2.2 0 0 1-3.1-3.1l6.3-6.3a5 5 0 0 1 6-6.6l-3 3 .8 3 3 .8 3-3z" fill="#F4B740" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
</symbol>

<!-- 車検証 / 書類 -->
<symbol id="ic-shaken" viewBox="0 0 48 48">
  <path d="M11 5h17l9 9v29H11z" fill="#0F766E"/>
  <path d="M28 5v9h9" fill="#0B5A54"/>
  <path d="M17 23h14M17 29h14M17 35h8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="34" cy="34" r="8" fill="#F4B740"/>
  <path d="M30.4 34l2.4 2.4 4.6-4.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- カスタマーサポート：ヘッドセットの人 -->
<symbol id="ic-support" viewBox="0 0 48 48">
  <path d="M11 25v-2a13 13 0 0 1 26 0v2" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <rect x="7" y="24" width="7" height="12" rx="3.5" fill="#0F766E"/>
  <rect x="34" y="24" width="7" height="12" rx="3.5" fill="#0F766E"/>
  <path d="M37 34v3a5 5 0 0 1-5 5h-6" fill="none" stroke="#F4B740" stroke-width="3" stroke-linecap="round"/>
  <circle cx="24" cy="40" r="3.4" fill="#F4B740"/>
  <circle cx="24" cy="19" r="6" fill="#F4B740"/>
</symbol>

<!-- 査定 / 検査：車＋虫眼鏡 -->
<symbol id="ic-inspect" viewBox="0 0 48 48">
  <path d="M6 30l3-9a4 4 0 0 1 3.8-2.7h13.4A4 4 0 0 1 30 21l3 9v6a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-1H12v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="#0F766E"/>
  <circle cx="12" cy="30" r="2.4" fill="#fff"/>
  <circle cx="27" cy="30" r="2.4" fill="#fff"/>
  <circle cx="33" cy="20" r="8.5" fill="none" stroke="#F4B740" stroke-width="3.4"/>
  <path d="M39 26l5 5" stroke="#F4B740" stroke-width="3.6" stroke-linecap="round"/>
</symbol>

<!-- 成約 / 契約：握手 -->
<symbol id="ic-contract" viewBox="0 0 48 48">
  <rect x="6" y="12" width="15" height="26" rx="2.5" fill="#0F766E"/>
  <rect x="27" y="12" width="15" height="26" rx="2.5" fill="#0F766E"/>
  <path d="M21 20l3-2 3 2v9l-3 2-3-2z" fill="#F4B740"/>
  <path d="M13 25h4l4 3M35 25h-4l-4 3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- 入金 / 振込：銀行＋円 -->
<symbol id="ic-pay" viewBox="0 0 48 48">
  <path d="M24 5l18 9H6z" fill="#0F766E"/>
  <rect x="6" y="14" width="36" height="4" fill="#0B5A54"/>
  <rect x="10" y="20" width="4" height="15" fill="#0F766E"/>
  <rect x="22" y="20" width="4" height="15" fill="#0F766E"/>
  <rect x="34" y="20" width="4" height="15" fill="#0F766E"/>
  <rect x="5" y="37" width="38" height="6" rx="2" fill="#0F766E"/>
  <circle cx="35" cy="30" r="9" fill="#F4B740"/>
  <path d="M31.5 25.5l3.5 4 3.5-4M35 29.5v6M32 32h6M32 34.6h6" stroke="#fff" stroke-width="1.9" stroke-linecap="round" fill="none"/>
</symbol>

<!-- 高価買取：上昇チャート＋円 -->
<symbol id="ic-highprice" viewBox="0 0 48 48">
  <path d="M6 40V8" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M6 40h36" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M11 32l8-8 6 5 12-13" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 16h8v8" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="37" cy="34" r="8" fill="#F4B740"/>
  <path d="M34 30.5l3 3.5 3-3.5M37 34v5M34.5 36h5M34.5 38h5" stroke="#fff" stroke-width="1.7" stroke-linecap="round" fill="none"/>
</symbol>

<!-- 手数料無料 / 安心：盾チェック -->
<symbol id="ic-shield" viewBox="0 0 48 48">
  <path d="M24 5l15 5v11c0 10-6.5 16-15 19-8.5-3-15-9-15-19V10z" fill="#0F766E"/>
  <path d="M16.5 24l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="10" r="0" fill="#F4B740"/>
</symbol>

<!-- 全国対応：地図ピン -->
<symbol id="ic-japan" viewBox="0 0 48 48">
  <path d="M24 4c-8.3 0-15 6.5-15 14.6C9 30 24 44 24 44s15-14 15-25.4C39 10.5 32.3 4 24 4z" fill="#0F766E"/>
  <circle cx="24" cy="18" r="7" fill="#fff"/>
  <circle cx="24" cy="18" r="3.4" fill="#F4B740"/>
</symbol>

<!-- 引取り / 陸送：積載車 -->
<symbol id="ic-truck" viewBox="0 0 48 48">
  <path d="M4 18h20v14H4z" fill="#0F766E"/>
  <path d="M24 22h9l6 6v4H24z" fill="#0F766E"/>
  <path d="M33 22v6h6" fill="#0B5A54"/>
  <rect x="6" y="12" width="16" height="4" rx="1.5" fill="#F4B740"/>
  <path d="M6 12l4-4h10l2 4" fill="#F4B740"/>
  <circle cx="13" cy="36" r="4.5" fill="#0B5A54"/><circle cx="13" cy="36" r="1.8" fill="#fff"/>
  <circle cx="33" cy="36" r="4.5" fill="#0B5A54"/><circle cx="33" cy="36" r="1.8" fill="#fff"/>
</symbol>

<!-- 電話不要 / 来店不要：スマホ完結 -->
<symbol id="ic-mobile" viewBox="0 0 48 48">
  <rect x="13" y="4" width="22" height="40" rx="5" fill="#0F766E"/>
  <rect x="17" y="9" width="14" height="24" rx="2" fill="#fff"/>
  <circle cx="24" cy="38" r="2.4" fill="#fff"/>
  <circle cx="24" cy="20" r="7" fill="#F4B740"/>
  <path d="M20.5 20l2.4 2.4 4.6-4.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</symbol>

<!-- スピード：稲妻 -->
<symbol id="ic-speed" viewBox="0 0 48 48">
  <circle cx="24" cy="24" r="20" fill="#0F766E"/>
  <path d="M26 8L14 27h8l-2 13 12-19h-8z" fill="#F4B740"/>
</symbol>

<!-- 買取実績 / データ：グラフ -->
<symbol id="ic-chart" viewBox="0 0 48 48">
  <rect x="5" y="6" width="38" height="36" rx="4" fill="#0F766E"/>
  <rect x="12" y="26" width="5" height="9" rx="1.5" fill="#fff"/>
  <rect x="21" y="20" width="5" height="15" rx="1.5" fill="#fff"/>
  <rect x="30" y="14" width="5" height="21" rx="1.5" fill="#F4B740"/>
</symbol>

</svg>
