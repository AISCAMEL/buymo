<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>オークション管理｜BUYMO 本部</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" />
<link rel="stylesheet" href="assets/css/buymo.css?v=38" />
<link rel="stylesheet" href="assets/css/board.css?v=13" />
</head>
<body>
<script src="assets/js/auth.js"></script><script>AUTH.guard("hq");</script>
<header class="portal-header">
  <div class="container">
    <a href="portal-login.html" class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/img/buymo/logo-mark.png?v=2" alt="" style="height:26px;width:26px;object-fit:contain;vertical-align:-7px;" /></span> BUYMO</a>
    <span class="portal-title">本部</span>
    <nav class="portal-nav" id="hqNav"></nav>
    <a href="portal-login.html" class="portal-logout">ログアウト</a>
  </div>
</header>

<main class="portal-main">
  <div class="container">
    <div class="report-head">
      <h1>オークション管理</h1>
      <button id="btnAucCsv" class="btn btn-primary btn-csv" type="button">⬇ CSV出力</button>
    </div>
    <p class="portal-sub">誰がどの車をいつ・どの会場へ搬入したか、落札／流れの結果、実際の仕入と売却益を一覧で可視化します。案件詳細（案件ボード）で入力した内容が反映されます。</p>

    <div class="au-kpis" id="auKpis"></div>
    <div class="au-filter" id="auFilter"></div>
    <div class="hq-table-wrap">
      <table class="au-table" id="auTable">
        <thead><tr>
          <th>案件</th><th>加盟店<span class="th-sub">誰が</span></th><th>会場<span class="th-sub">どこへ</span></th>
          <th>搬送</th><th>搬入日<span class="th-sub">いつ</span></th><th>出品週</th><th>結果</th>
          <th>仕入</th><th>落札額</th><th>粗利</th><th>本部手数料</th><th>お渡し額</th>
        </tr></thead>
        <tbody id="auBody"><tr><td colspan="12" class="au-empty">読み込み中…</td></tr></tbody>
      </table>
    </div>
    <p class="au-note" id="auNote"></p>
  </div>
</main>

<style>
.au-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:6px 0 16px;}
@media(max-width:900px){.au-kpis{grid-template-columns:repeat(3,1fr);}}
@media(max-width:560px){.au-kpis{grid-template-columns:repeat(2,1fr);}}
.au-kpi{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;}
.au-kpi .k-num{font-size:22px;font-weight:900;color:var(--navy);line-height:1.1;}
.au-kpi .k-num small{font-size:12px;color:#999;}
.au-kpi .k-label{font-size:11px;color:#888;margin-top:4px;font-weight:700;}
.au-kpi.sold .k-num{color:#0F766E;} .au-kpi.flow .k-num{color:#C2410C;}
.au-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.au-chip{border:1px solid #dde3ee;background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;color:#556;cursor:pointer;}
.au-chip.on{background:#0F766E;color:#fff;border-color:#0F766E;}
.au-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:1040px;}
.au-table th,.au-table td{padding:9px 10px;border-bottom:1px solid #eef1f6;text-align:right;white-space:nowrap;}
.au-table th:first-child,.au-table td:first-child,.au-table th:nth-child(2),.au-table td:nth-child(2),.au-table th:nth-child(3),.au-table td:nth-child(3),.au-table th:nth-child(4),.au-table td:nth-child(4),.au-table th:nth-child(7),.au-table td:nth-child(7){text-align:left;}
.au-table thead th{background:#f4f6fa;color:#666;font-weight:700;font-size:11.5px;vertical-align:bottom;}
.th-sub{display:block;font-size:10px;color:#aaa;font-weight:400;}
.au-table td.au-case{font-weight:800;color:var(--navy);}
.au-res{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;color:#fff;}
.au-res.出品予定{background:#64748b;} .au-res.搬入済{background:#0284c7;} .au-res.落札{background:#0F766E;} .au-res.流れ{background:#C2410C;}
.au-profit.pos{color:#0F766E;font-weight:800;} .au-profit.neg{color:#B91C1C;font-weight:800;}
.au-flow-tag{display:block;font-size:10px;color:#C2410C;font-weight:700;}
.au-empty{color:#999;text-align:center;padding:24px;}
.au-note{font-size:12px;color:#999;margin-top:12px;}
</style>

<script src="assets/js/hq-common.js?v=13"></script>
<script src="assets/js/hq-auctions.js?v=1" defer></script>
<script src="assets/js/analytics.js?v=2" defer></script>
</body>
</html>
