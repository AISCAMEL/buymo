<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>業務ボード｜BUYMO（本部／加盟店）</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="stylesheet" href="assets/css/buymo.css?v=40" />
<link rel="stylesheet" href="assets/css/board.css?v=15" />
<style>.kb-card{position:relative;cursor:pointer;}.kb-open{position:absolute;right:8px;bottom:8px;margin:0;padding:3px 9px;border:1px solid #cfe3d8;border-radius:999px;background:#fff;color:#0A6B3C;font-weight:700;font-size:11.5px;cursor:pointer;touch-action:manipulation;}.kb-open:active{background:#E6F4EC;}.kb-card .kb-thumb{position:absolute;top:8px;right:8px;width:52px;height:40px;margin:0;border-radius:6px;overflow:hidden;}.kb-card .kb-thumb img{width:100%;height:100%;object-fit:cover;display:block;}.kb-card .kb-thumb-more{font-size:10px;padding:0 3px;}.kb-card:has(.kb-thumb) .kb-card-top,.kb-card:has(.kb-thumb) .kb-name{padding-right:58px;}.kb-col-unassigned .kb-assign-row{margin-right:58px;}.kb-memo-s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-right:46px;}.kb-card:not(:has(.kb-memo-s)) .kb-meta{padding-right:46px;}.cp-vehicle-photo-img{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:4px 6px 4px 0;text-decoration:none;}.cp-vehicle-photo-img img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #e3e7ee;background:#f3f5f8;}</style>
<link rel="stylesheet" href="assets/css/app.css?v=6" />
</head>
<body>
<script src="assets/js/auth.js?v=3"></script><script>AUTH.guard("staff");</script>

<header class="portal-header">
  <div class="container">
    <a href="portal-login.html" class="logo"><span class="logo-mark" aria-hidden="true"><img src="assets/img/buymo/logo-mark-64.png?v=1" alt="" style="height:26px;width:26px;object-fit:contain;vertical-align:-7px;" /></span> BUYMO</a>
    <span class="portal-title">業務ボード</span>
    <nav class="portal-nav" id="hqNav"></nav>
    <span class="portal-role" id="roleLabel">本部</span>
    <a href="portal-login.html" class="portal-logout">ログアウト</a>
  </div>
</header>

<main class="portal-main">
  <div class="container">
    <img class="page-mascot" src="assets/img/buymo/m/31_スケジュール管理ポーズ.webp" alt="" aria-hidden="true">
    <h1>案件ボード（看板）</h1>
    <p class="portal-sub">査定の申し込みは自動で「新規受付」に入ります。カードをドラッグしてステージを移動できます（GAS接続時はSlackにもステージ変更を通知）。</p>

    <!-- 営業サマリー -->
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">案件総数</div><div class="kpi-num" id="sumTotal">0件</div></div>
      <div class="kpi"><div class="kpi-label">商談成立（契約以降）</div><div class="kpi-num" id="sumWon">0件</div></div>
      <div class="kpi accent"><div class="kpi-label">想定売上（契約以降）</div><div class="kpi-num" id="sumAmount">¥0</div></div>
      <div class="kpi"><div class="kpi-label">完了</div><div class="kpi-num" id="sumDone">0件</div></div>
    </div>

    <!-- 新規案件 -->
    <div class="add-bar">
      <form id="addForm">
        <input class="ac-name" id="acName" type="text" placeholder="お名前（必須）" />
        <input id="acTel" type="text" placeholder="連絡先" />
        <input id="acGenre" type="text" placeholder="ジャンル（例：廃車）" />
        <input id="acAssignee" type="text" placeholder="担当（加盟店）" />
        <button type="submit" class="btn btn-primary">案件を追加</button>
      </form>
    </div>

    <!-- カンバン -->
    <div class="kanban" id="board" aria-label="案件カンバン"></div>
  </div>
</main>

<script src="assets/js/hq-common.js?v=20"></script>
<script>HQ.nav('board');</script>
<script src="assets/js/notices.js"></script>
<script src="assets/js/board.js?v=14" defer></script>
<script src="assets/js/analytics.js?v=2" defer></script>
</body>
</html>
