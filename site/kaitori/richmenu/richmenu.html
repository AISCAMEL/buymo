<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<title>リッチメニュー画像（2500×1686）｜BUYMO 車買取</title>
<!--
  BUYMO 車買取の公式LINE のリッチメニュー画像の元データ。
  2500×1686 の範囲をスクリーンショットし、JPEG（1MB以下）で richmenu-large.jpg として保存する
  （手順は BUYMO_車買取_LINEミニアプリ_セットアップ.md）。
  レイアウト：上1（2500×843）＋下3（833/834/833×843）＝ LINE Official Account Manager のテンプレート「上1・下3」
    上 ：写真で無料査定           → ミニアプリ ?view=satei
    左下：30秒で相場チェック       → ミニアプリ ?view=home
    中下：AIに相談（24時間）       → ミニアプリ ?view=ai
    右下：トークで相談             → テキスト「車の売却について相談したいです」
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Outfit:wght@700;900&display=swap" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333}
  .menu{width:2500px;height:1686px;display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px;font-family:'Noto Sans JP',sans-serif}
  .ico{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .top{grid-column:1 / 4;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 120px;
    background:linear-gradient(150deg,#0C3A44 0%,#0B5A54 55%,#0F766E 100%);color:#fff}
  .top .glow{position:absolute;right:-220px;top:-300px;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(45,225,188,.35),rgba(45,225,188,0) 65%)}
  .top .txt{position:relative;flex:1;display:flex;flex-direction:column;gap:34px}
  .brand{display:flex;align-items:center;gap:26px;font-family:'Outfit',sans-serif;font-weight:900;font-size:72px;letter-spacing:.12em}
  .brand img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:28px;padding:10px}
  .brand span{font-family:'Noto Sans JP',sans-serif;font-size:46px;font-weight:700;letter-spacing:.04em;color:#2DE1BC}
  .top h1{font-size:150px;font-weight:900;line-height:1.15;letter-spacing:.01em}
  .top h1 em{font-style:normal;background:linear-gradient(transparent 70%,rgba(224,189,106,.95) 70%)}
  .chips{display:flex;gap:22px}
  .chips b{font-size:46px;font-weight:700;padding:10px 32px;border-radius:999px;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.3)}
  .top .cta{position:relative;flex:none;width:560px;height:560px;border-radius:50%;background:linear-gradient(180deg,#EBCB7E,#E0BD6A);color:#2E2408;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
  .top .cta .ico{width:170px;height:170px;stroke:#2E2408;stroke-width:1.8}
  .top .cta b{font-size:66px;font-weight:900}
  .top .cta small{font-size:44px;font-weight:700}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#fff;color:#0A1B3D;border-top:6px solid #E4E7EC}
  .cell + .cell{border-left:6px solid #E4E7EC}
  .cell .ring{width:250px;height:250px;border-radius:50%;display:grid;place-items:center;background:#D8F7F0}
  .cell .ring .ico{width:140px;height:140px;stroke:#0F766E;stroke-width:1.8}
  .cell b{font-size:84px;font-weight:900;line-height:1.1}
  .cell small{font-size:48px;font-weight:700;color:#667085}
  .cell.line .ring{background:#E7F9EE}
  .cell.line .ring .ico{stroke:#06C755}
</style>
</head>
<body>
<div class="menu" id="menu">
  <div class="top">
    <div class="glow"></div>
    <div class="txt">
      <div class="brand"><img src="../../assets/img/buymo/logo-mark.png?v=2" alt="" />BUYMO<span>車買取</span></div>
      <h1>スマホで撮って、<br><em>送るだけ。</em></h1>
      <div class="chips"><b>査定料・手数料0円</b><b>最短3営業日入金</b><b>全国対応</b></div>
    </div>
    <div class="cta">
      <svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      <b>写真で無料査定</b>
      <small>約3分・タップで開始</small>
    </div>
  </div>
  <div class="cell">
    <div class="ring"><svg class="ico" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg></div>
    <b>30秒で相場</b><small>おおよその買取額</small>
  </div>
  <div class="cell">
    <div class="ring"><svg class="ico" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></div>
    <b>AIに相談</b><small>24時間・何度でも</small>
  </div>
  <div class="cell line">
    <div class="ring"><svg class="ico" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div>
    <b>トークで相談</b><small>担当者にもつながる</small>
  </div>
</div>
</body>
</html>
