<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<title>リッチメニュー画像（2500×1686）｜BUYMO 車買取</title>
<!--
  BUYMO 車買取の公式LINE のリッチメニュー画像の元データ。
  2500×1686 の範囲をスクリーンショットし、JPEG（1MB以下）で richmenu-large.jpg として保存する
  （手順は BUYMO_車買取_LINEミニアプリ_セットアップ.md）。
  レイアウト：上1（2500×843）＋下3（833/834/833×843）＝ LINE Official Account Manager のテンプレート「上1・下3」
    上 ：写真で無料査定           → ミニアプリ ?view=satei
    左下：30秒で相場チェック       → ミニアプリ ?view=home
    中下：AIに相談（24時間）       → ミニアプリ ?view=ai
    右下：トークで相談             → テキスト「車の売却について相談したいです」
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Outfit:wght@700;900&family=Zen+Maru+Gothic:wght@900&display=swap" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333}
  .menu{width:2500px;height:1686px;display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px;font-family:'Noto Sans JP',sans-serif;background:#FFFBF5}
  .ico{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .top{grid-column:1 / 4;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 90px 0 120px;
    background:linear-gradient(135deg,#DDF7EF 0%,#F2FBF7 45%,#FFE9D6 100%);color:#1F2A44}
  .top .txt{position:relative;flex:1;display:flex;flex-direction:column;gap:26px}
  .brand{display:flex;align-items:center;gap:22px;font-family:'Outfit',sans-serif;font-weight:900;font-size:66px;letter-spacing:.12em}
  .brand img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:26px;padding:8px;box-shadow:0 8px 20px rgba(31,42,68,.1)}
  .brand span{font-family:'Zen Maru Gothic',sans-serif;font-size:46px;font-weight:900;letter-spacing:.04em;color:#FF8A3D}
  .top h1{font-family:'Zen Maru Gothic',sans-serif;font-size:118px;font-weight:900;line-height:1.18}
  .top h1 em{font-style:normal;background:linear-gradient(transparent 58%,#FFD45C 58%)}
  .chips{display:flex;gap:20px}
  .chips b{font-size:44px;font-weight:700;padding:10px 30px;border-radius:999px;background:#fff;border:4px solid #BDEFE2;color:#0A7F70}
  .chips b:nth-child(2){border-color:#FFD8BC;color:#C85A12}
  .chips b:nth-child(3){border-color:#C9E2FF;color:#2F6FB8}
  .mascot{position:relative;flex:none;width:430px;height:700px;display:flex;align-items:flex-end;justify-content:center}
  .mascot img{height:640px;width:auto;filter:drop-shadow(0 20px 26px rgba(31,42,68,.18))}
  .cta{align-self:flex-start;display:flex;align-items:center;gap:22px;background:#FF8A3D;color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:72px;padding:22px 56px 22px 44px;border-radius:999px;box-shadow:0 18px 36px rgba(255,138,61,.4)}
  .cta .ico{width:84px;height:84px;stroke:#fff;stroke-width:2}
  .cta small{font-size:44px;font-weight:700;opacity:.95}
  .cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#fff;color:#1F2A44;border-top:6px solid #EDE7DE}
  .cell + .cell{border-left:6px solid #EDE7DE}
  .cell .ring{width:250px;height:250px;border-radius:50%;display:grid;place-items:center}
  .cell .ring .ico{width:136px;height:136px;stroke-width:1.8}
  .cell b{font-family:'Zen Maru Gothic',sans-serif;font-size:86px;font-weight:900;line-height:1.1}
  .cell small{font-size:48px;font-weight:700;color:#6B7280}
  .c1 .ring{background:#FFF7D6}.c1 .ico{stroke:#C58A00}
  .c2 .ring{background:#E3F8F2}.c2 .ico{stroke:#0E9F8C}
  .c3 .ring{background:#FFF0E3}.c3 .ico{stroke:#FF8A3D}
</style>
</head>
<body>
<div class="menu" id="menu">
  <div class="top">
    <div class="txt">
      <div class="brand"><img src="../../assets/img/buymo/logo-mark.png?v=2" alt="" />BUYMO<span>車買取</span></div>
      <h1>スマホで撮って、<br><em>送るだけ。</em></h1>
      <div class="cta"><svg class="ico" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>写真で無料査定<small>約3分</small></div>
      <div class="chips"><b>査定料・手数料0円</b><b>最短3営業日入金</b><b>全国対応</b></div>
    </div>
    <div class="mascot">
      <img src="../img/m-tablet.webp" alt="" />
    </div>
  </div>
  <div class="cell c1">
    <div class="ring"><svg class="ico" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg></div>
    <b>30秒で相場</b><small>おおよその買取額</small>
  </div>
  <div class="cell c2">
    <div class="ring"><svg class="ico" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></div>
    <b>AIに相談</b><small>24時間・何度でも</small>
  </div>
  <div class="cell c3">
    <div class="ring"><svg class="ico" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></div>
    <b>トークで相談</b><small>担当者にもつながる</small>
  </div>
</div>
</body>
</html>
