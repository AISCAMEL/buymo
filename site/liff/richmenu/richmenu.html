<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<title>リッチメニュー画像（2500×1686）｜オルタナティブライフ</title>
<!--
  LINE公式アカウントのリッチメニュー画像の元データ（副業パートナー募集向け）。
  ブラウザで 2500×1686 の範囲をスクリーンショットし、JPEG（1MB以下）で richmenu-large.jpg として保存する
  （手順は BUYMO_LINE_LIFF_オルタナティブライフ_セットアップ.md）。
  レイアウト：上1（2500×843）＋下3（833/834/833×843）＝ LINE Official Account Manager のテンプレート「上1・下3」
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@500;700&family=Fraunces:ital,wght@1,600&display=swap" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#333}
  .menu{
    width:2500px;height:1686px;display:grid;grid-template-columns:833px 834px 833px;grid-template-rows:843px 843px;
    font-family:'Noto Sans JP',sans-serif;background:#FBF7F0;
  }
  .ico{fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* 上：資料請求 */
  .top{grid-column:1 / 4;position:relative;overflow:hidden;background:#FBF7F0;display:flex;align-items:center;padding-left:130px}
  .top .sun{position:absolute;right:250px;top:-330px;width:1100px;height:1100px;border-radius:50%;
    background:radial-gradient(circle at 45% 60%,rgba(255,176,77,.55),rgba(255,138,61,.16) 55%,rgba(255,138,61,0) 72%)}
  .top .txt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:30px;width:1380px}
  .mark{display:flex;align-items:baseline;gap:26px;color:#0F2A4D}
  .mark b{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:76px;letter-spacing:.01em}
  .mark b::after{content:"";display:inline-block;width:20px;height:20px;border-radius:50%;background:#FF8A3D;margin-left:8px}
  .mark span{font-size:40px;font-weight:700;color:#66707F}
  .top h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:126px;line-height:1.3;color:#0F2A4D;letter-spacing:.01em}
  .top h1 em{font-style:normal;background:linear-gradient(transparent 60%,#FFB04D 60%,#FFB04D 90%,transparent 90%)}
  .pill{display:inline-flex;align-items:center;gap:24px;margin-top:6px;
    background:linear-gradient(135deg,#FF8A3D,#FFB04D);color:#0F2A4D;font-size:68px;font-weight:700;
    padding:26px 64px 26px 56px;border-radius:999px;box-shadow:0 18px 40px rgba(255,138,61,.35)}
  .pill svg{width:76px;height:76px;stroke:#0F2A4D;stroke-width:2.3}
  .pill i{font-style:normal;font-size:60px;margin-left:6px}
  .top img{position:absolute;right:20px;bottom:-30px;height:930px}

  /* 下：3つ */
  .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;color:#fff;border-top:8px solid #FBF7F0}
  .tile + .tile{border-left:8px solid #FBF7F0}
  .tile .badge{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1)}
  .tile .badge svg{width:130px;height:130px;stroke:#FFB04D;stroke-width:1.9}
  .tile b{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:96px;line-height:1.2}
  .tile span{font-size:46px;font-weight:500;color:rgba(255,255,255,.8)}
  .b1{background:#0F2A4D}
  .b2{background:#1B3A64}
  .b3{background:#06C755}
  .b3 .badge{background:rgba(255,255,255,.18)}
  .b3 .badge svg{stroke:#fff}
  .b3 span{color:rgba(255,255,255,.92)}
</style>
</head>
<body>
<div class="menu" id="menu">
  <div class="top">
    <div class="sun"></div>
    <div class="txt">
      <p class="mark"><b>Alternative Life</b><span>副業パートナー by BUYMO</span></p>
      <h1>本業はそのまま。<br>もうひとつの<em>収入</em>を。</h1>
      <p class="pill"><svg class="ico" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>無料で資料を受け取る<i>›</i></p>
    </div>
    <img src="../../assets/img/buymo/partner-hero.png" alt="" />
  </div>
  <div class="tile b1">
    <span class="badge"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></span>
    <b>スタイル診断</b><span>4問・約1分</span>
  </div>
  <div class="tile b2">
    <span class="badge"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span>
    <b>仕組み・Q&amp;A</b><span>はじめる前の疑問に</span>
  </div>
  <div class="tile b3">
    <span class="badge"><svg class="ico" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
    <b>トーク相談</b><span>費用・エリアも気軽に</span>
  </div>
</div>
</body>
</html>
